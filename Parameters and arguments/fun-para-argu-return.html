<!DOCTYPE HTML>
<html>
	<head>
		<title>
			Parameters and arguments and return  
		</title>
	</head>
	<body>
		<script>
			//parameters when you define function
			function add(num1, num2){
				return num1 + num2;
			}
			
			//arguments when you call function
			//var res = ;
			function mins(){
				var addn = add(8, 9);
				console.log(addn - 5);
			}
			
			mins();
		</script>
	</body>
</html>
